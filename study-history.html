<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abhinav - Study Time History</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#1c2434; --muted:#5b6b84;
    --line:#d7dee9; --accent:#2563eb; --accent-ink:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#1a2233; --ink:#e8edf6; --muted:#9fb0c9;
      --line:#31405e; --accent:#5b8cff; --accent-ink:#0e1420;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:Verdana,Geneva,system-ui,sans-serif;font-size:14.5px;line-height:1.5}
  main{max-width:880px;margin:0 auto;padding:22px 14px 60px}
  h1{font-size:21px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:14px 18px;margin:12px 0}
  .card h2{font-size:15.5px;margin:0 0 8px}
  .big{font-size:26px;font-weight:bold}
  .split{color:var(--muted);margin-top:4px}
  .split b{color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:normal}
  .streak{display:inline-block;background:var(--accent);color:var(--accent-ink);
          border-radius:999px;padding:2px 12px;font-weight:bold}
  .err{color:#c0392b}
  @media (prefers-color-scheme: dark){ .err{color:#ff8a7a} }
</style>
</head>
<body>
<main>
  <h1>Study Time History</h1>
  <div class="sub">Synced from Abhinav's trainers and simulators (active time only). Stored in Firebase; the on-page panel still keeps its local copy.</div>
  <div id="status" class="card">Loading synced study time...</div>
  <div id="app" style="display:none">
    <div class="card">
      <h2>Today</h2>
      <div class="big" id="todayTotal">-</div>
      <div class="split" id="todaySplit"></div>
      <div style="margin-top:10px">Current daily streak: <span class="streak" id="streak">0 days</span></div>
    </div>
    <div class="card">
      <h2>Last 14 days (minutes per subject)</h2>
      <div id="dayTable"></div>
    </div>
    <div class="card">
      <h2>Totals by subject</h2>
      <div id="totals"></div>
    </div>
    <div class="card" id="runsCard" style="display:none">
      <h2>Recent simulator runs</h2>
      <div id="runs"></div>
    </div>
  </div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

var CFG = {apiKey: 'AIzaSyBJ46ycJ-qFky2mChCI24Fxc7_dGWMDtdY', authDomain: 'abhinav-study-log.firebaseapp.com', projectId: 'abhinav-study-log', storageBucket: 'abhinav-study-log.firebasestorage.app', messagingSenderId: '244469248857', appId: '1:244469248857:web:1b4f62877033a327b15248'};
var SUBJECTS = ['Geography', 'History', 'Science', 'Exams', 'Other'];

function dstr(d){
  var m = ('0'+(d.getMonth()+1)).slice(-2), dd = ('0'+d.getDate()).slice(-2);
  return d.getFullYear()+'-'+m+'-'+dd;
}
function shift(dateStr, days){
  var p = dateStr.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+days);
  return dstr(d);
}
function fmtDur(sec){
  if(sec < 60) return sec + 's';
  var m = sec/60;
  return (m < 10 ? m.toFixed(1) : Math.round(m)) + ' min';
}
function fmtMin(sec){
  if(!sec) return '-';
  var m = sec/60;
  return m < 10 ? m.toFixed(1) : String(Math.round(m));
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

async function main(){
  var status = document.getElementById('status');
  try {
    var app = initializeApp(CFG);
    var db = getFirestore(app);
    var results = await Promise.all([
      getDocs(collection(db, 'sessions')),
      getDocs(collection(db, 'simRuns')).catch(function(){ return null; })
    ]);
    var snap = results[0], runSnap = results[1];
    var byDate = {}; // date -> {subject: secs, _total: secs}
    snap.forEach(function(doc){
      var d = doc.data();
      if(!d || typeof d.secs !== 'number' || !d.date) return;
      var subj = SUBJECTS.indexOf(d.subject) >= 0 ? d.subject : 'Other';
      var day = byDate[d.date] || (byDate[d.date] = {_total: 0});
      day[subj] = (day[subj] || 0) + d.secs;
      day._total += d.secs;
    });
    var today = dstr(new Date());
    if(!Object.keys(byDate).length){
      status.innerHTML = 'No synced study time yet. It will appear here after Abhinav spends time on a trainer or simulator page (synced about once a minute while a page is open).';
      return;
    }
    // Today
    var td = byDate[today] || {_total: 0};
    document.getElementById('todayTotal').textContent = fmtDur(td._total || 0);
    var parts = SUBJECTS.filter(function(s){ return td[s]; }).map(function(s){ return '<b>' + s + '</b> ' + fmtDur(td[s]); });
    document.getElementById('todaySplit').innerHTML = parts.length ? parts.join(' &middot; ') : 'Nothing logged yet today.';
    // Streak: consecutive days with time, anchored on today or yesterday
    var anchor = byDate[today] && byDate[today]._total > 0 ? today : (byDate[shift(today, -1)] && byDate[shift(today, -1)]._total > 0 ? shift(today, -1) : null);
    var streak = 0;
    if(anchor){
      var cur = anchor;
      while(byDate[cur] && byDate[cur]._total > 0){ streak++; cur = shift(cur, -1); }
    }
    document.getElementById('streak').textContent = streak + (streak === 1 ? ' day' : ' days');
    // Last 14 days table
    var h = '<table><tr><th>Date</th>' + SUBJECTS.map(function(s){ return '<th>' + s + '</th>'; }).join('') + '<th>Total</th></tr>';
    for(var i = 0; i < 14; i++){
      var ds = shift(today, -i), row = byDate[ds] || {_total: 0};
      h += '<tr><td>' + ds.slice(5) + (i === 0 ? ' (today)' : '') + '</td>' +
           SUBJECTS.map(function(s){ return '<td>' + fmtMin(row[s] || 0) + '</td>'; }).join('') +
           '<td><b>' + fmtMin(row._total || 0) + '</b></td></tr>';
    }
    h += '</table>';
    document.getElementById('dayTable').innerHTML = h;
    // Totals: last 30 days and all time, per subject
    var cut30 = shift(today, -29), t30 = {}, tall = {}, g30 = 0, gall = 0;
    Object.keys(byDate).forEach(function(ds){
      SUBJECTS.forEach(function(s){
        var v = byDate[ds][s] || 0;
        tall[s] = (tall[s] || 0) + v;
        if(ds >= cut30){ t30[s] = (t30[s] || 0) + v; }
      });
      gall += byDate[ds]._total;
      if(ds >= cut30) g30 += byDate[ds]._total;
    });
    var th = '<table><tr><th>Subject</th><th>Last 30 days</th><th>All time</th></tr>';
    SUBJECTS.forEach(function(s){
      if(!tall[s]) return;
      th += '<tr><td>' + s + '</td><td>' + fmtDur(t30[s] || 0) + '</td><td>' + fmtDur(tall[s] || 0) + '</td></tr>';
    });
    th += '<tr><td><b>All subjects</b></td><td><b>' + fmtDur(g30) + '</b></td><td><b>' + fmtDur(gall) + '</b></td></tr></table>';
    document.getElementById('totals').innerHTML = th;
    // Simulator runs
    if(runSnap && !runSnap.empty){
      var runs = [];
      runSnap.forEach(function(doc){ var d = doc.data(); if(d && typeof d.ts === 'number') runs.push(d); });
      runs.sort(function(a, b){ return b.ts - a.ts; });
      runs = runs.slice(0, 10);
      if(runs.length){
        var rh = '<table><tr><th>Date</th><th>Subject</th><th>Score</th><th>Accuracy</th></tr>';
        runs.forEach(function(r){
          var score = String(r.score);
          if(r.finalScore != null) score += ' (final ' + r.finalScore + ')';
          rh += '<tr><td>' + esc(r.date || '') + '</td><td>' + esc(r.subject || '') + '</td><td>' + score + '</td><td>' + (r.accuracyPct != null ? r.accuracyPct + '%' : '-') + '</td></tr>';
        });
        rh += '</table>';
        document.getElementById('runs').innerHTML = rh;
        document.getElementById('runsCard').style.display = '';
      }
    }
    status.style.display = 'none';
    document.getElementById('app').style.display = '';
  } catch(e) {
    status.innerHTML = '<span class="err">Could not load the synced study history. Check the connection and reload.</span>';
  }
}
main();
</script>
</body>
</html>
