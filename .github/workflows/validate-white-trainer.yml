name: Validate White Geography Trainer
on:
  pull_request:
    paths:
      - 'white-trainer.html'
      - 'scripts/check-white-trainer.cjs'
      - '.github/workflows/validate-white-trainer.yml'
  push:
    paths:
      - 'white-trainer.html'
      - 'scripts/check-white-trainer.cjs'
      - '.github/workflows/validate-white-trainer.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-white-trainer.cjs
